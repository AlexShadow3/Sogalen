name: Deploy to Raspberry Pi

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy updates
        run: |
          cd /home/cosmoss/Documents/Sogalen
          git pull origin master
          npm install --omit=dev
          node deploy-commands.js

          if pm2 describe sogalen > /dev/null 2>&1; then
            echo "Redémarrage du bot..."
            pm2 restart sogalen
          else
            echo "Premier démarrage du bot..."
            pm2 start main.js --name "sogalen"
          fi

          pm2 save