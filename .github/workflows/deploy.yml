name: Deploy to Raspberry Pi

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull code, install deps and restart bot
        run: |
          cd /home/cosmoss/Documents/Sogalen
          git pull origin master
          npm install --omit=dev
          node deploy-commands.js
          pm2 restart sogalen
